<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCADA Engineering Verification &amp; Commissioning Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Offline-capable assistant for SCADA I/O verification, tag checks, alarm/trip tests, FAT/SAT, commissioning checklists, defects and reports.">
<meta name="theme-color" content="#0e1317">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCADA EVC">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="38" height="38"><div><b>SCADA Verification</b><span>&amp; Commissioning Assistant</span></div></div>
    <nav aria-label="Modules"><ul class="nav" id="nav"></ul></nav>
    <div class="side-foot">
      <button type="button" class="btn sm hidden" id="installBtn">Install app</button>
      <span>Verification aid only — not a safety controller. Never sends commands to equipment.</span>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="content">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation menu" aria-controls="sidebar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="scope"><label class="sr-only" for="scopeSelect">Project filter</label><select id="scopeSelect"></select>
        <button type="button" class="icon-btn" id="favBtn" aria-pressed="false" aria-label="Toggle favorite project"></button></div>
      <form class="search-form" id="searchForm" role="search"><label class="sr-only" for="globalSearch">Search all records</label>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM20 20l-4-4"/></svg>
        <input type="search" id="globalSearch" placeholder="Search tags, tests, defects…" autocomplete="off"></form>
      <span class="grow"></span>
      <span class="pill" id="onlinePill" aria-live="polite"></span>
      <button type="button" class="btn sm ghost" id="engBtn" aria-label="Set engineer name"><span class="sr-only">Engineer: </span><span>Set your name</span></button>
    </header>
    <div id="banners" aria-live="polite"></div>
    <main id="main" tabindex="-1"><p style="padding:20px">Loading…</p></main>
  </div>
</div>
<div id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>
<noscript><p style="padding:20px;color:#fff">This application needs JavaScript enabled.</p></noscript>
<script src="js/util.js"></script>
<script src="js/csv.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/pdf.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/logic.js"></script>
<script src="js/builtin.js"></script>
<script src="js/sample.js"></script>
<script src="js/common.js"></script>
<script src="js/exports.js"></script>
<script src="js/views-projects.js"></script>
<script src="js/views-io.js"></script>
<script src="js/views-tags.js"></script>
<script src="js/views-alarms.js"></script>
<script src="js/views-comms.js"></script>
<script src="js/views-fatsat.js"></script>
<script src="js/views-checklist.js"></script>
<script src="js/views-defects.js"></script>
<script src="js/views-reports.js"></script>
<script src="js/views-dashboard.js"></script>
<script src="js/views-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
